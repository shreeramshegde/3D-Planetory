version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: devcosmos_postgres
    environment:
      POSTGRES_USER: devcosmos
      POSTGRES_PASSWORD: devcosmos_password
      POSTGRES_DB: devcosmos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devcosmos -d devcosmos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devcosmos_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://devcosmos:devcosmos_password@db:5432/devcosmos_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devcosmos_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
